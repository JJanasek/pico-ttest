; PlatformIO project for the TROPIC01 TVLA capture target.
;
; Builds tvla_target.cpp only: host-driven firmware that waits for serial commands and raises
; TVLA_TRIGGER_PIN around each signature so an oscilloscope can trigger on it. Driven by
; ../tvla_capture.py; see ../README.md for the serial protocol and wiring.

[env:esp32dev_tvla]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    https://github.com/tropicsquare/libtropic-arduino.git

; The ESP32's USB-serial bridge. Change to the port your board maps to.
upload_port = /dev/ttyUSB0
monitor_speed = 115200

build_src_filter = +<tvla_target.cpp>
build_flags =
    -DTVLA_TRIGGER_PIN=4      ; GPIO raised around each sign call -> scope trigger (Husky TIO4)
    -DTVLA_SERIAL_BAUD=115200
